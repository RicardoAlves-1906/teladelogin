<!DOCTYPE html> 
<html lang="pt-br"> 
<head> <meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Tela de Login</title> <link rel="stylesheet" href="styles.css"> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet"> 

</head> 
<body> 
    <div class="container"> 
        <div class="login-box"> 
            <h2>Cadastro de Usuario</h2> 
            <form id="login-form"> 
                <div class="input-group"> 
                    <label for="username">CPF/ RG / Matricula</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="username">Nome Completo</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="username">E-mail</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="username">Senha</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="username">Confirmar Senha</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="username">Endereco</label> <input type="text" id="username" placeholder=""> 
                </div> 

                <div class="input-group"> 
                    <label for="password">Telefone</label> <input type="password" id="password" placeholder=""> 
                </div> 
                
                <button type="submit">CADASTRAR</button> 
                    
            </form> 
        </div> 
    </div> 
    <script src="scripts.js"></script> 
</body> 
</html>
